name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Tests
        run: flutter test --coverage

  build-android:
    name: Build Android (APK & AAB)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Decode Android Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
        # Note: If no keystore is provided, the build will use debug keystore or fail if misconfigured in build.gradle
        continue-on-error: true

      - name: Build APK (prod)
        run: flutter build apk --flavor prod --dart-define-from-file=config/prod.json --release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PATH: keystore.jks

      - name: Build AAB (prod)
        run: flutter build appbundle --flavor prod --dart-define-from-file=config/prod.json --release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PATH: keystore.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab

  build-ios:
    name: Build iOS (IPA)
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Build IPA (prod)
        # Note: Code signing requires a valid ExportOptions.plist and App Store Connect API keys configured
        run: flutter build ipa --flavor prod --dart-define-from-file=config/prod.json --release --no-codesign

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.ipa
          path: build/ios/ipa/*.ipa

  deploy:
    name: Deploy
    needs: [build-android, build-ios]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release.apk
          path: build/outputs/apk/

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release.aab
          path: build/outputs/bundle/

      - name: Firebase App Distribution (APK)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-testers
          file: build/outputs/apk/app-prod-release.apk
        continue-on-error: true

      - name: Google Play Internal Track (AAB)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.stockscreener.stock_screener
          releaseFiles: build/outputs/bundle/app-prod-release.aab
          track: internal
        continue-on-error: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/outputs/apk/app-prod-release.apk
            build/outputs/bundle/app-prod-release.aab
